appId: com.mocquereau.app
productName: Mocquereau
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - "!node_modules/**/*"
extraResources:
  - from: resources/examples
    to: examples
    filter:
      - "*.mocquereau"
icon: resources/icon.png
win:
  target:
    - target: nsis
      arch:
        - x64
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.education
linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Education
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
